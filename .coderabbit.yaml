language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - dev
  path_instructions:
    - path: "apps/server/src/share/**"
      instructions: "Share system — verify that draft, gmOnly, and protected notes are filtered from public rendering. Check world variable expansion for injection risks."
    - path: "apps/server/src/services/**"
      instructions: "Core services — check that Becca cache is properly invalidated after writes, NodeNext imports use .js extensions."
    - path: "apps/server/src/routes/api/**"
      instructions: "ETAPI routes — verify auth token validation, input sanitization, and that response shapes match documented contracts."
chat:
  auto_reply: true
